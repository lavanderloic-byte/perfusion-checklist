<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wash 10 min</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;background:#f6f6f6;color:#111;
    font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  main{max-width:560px;margin:auto;padding:34px 18px 44px}
  h1{font-size:30px;margin:0 0 8px}
  #session{font-size:18px;color:#666;margin-bottom:24px}
  #timer{
    background:#fff;border-radius:18px;padding:28px 18px;
    text-align:center;font-size:72px;font-weight:700;letter-spacing:2px;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
  }
  #status{text-align:center;margin-top:14px;font-size:18px;color:#666}
  #done{
    display:none;text-align:center;margin-top:20px;
    font-size:26px;font-weight:700;
  }
  .actions{display:grid;gap:10px;margin-top:24px}
  button{
    width:100%;border:0;border-radius:14px;padding:16px;
    font-size:18px;background:#222;color:#fff;
  }
  button.secondary{background:#e9e9e9;color:#111}
  section{margin-top:30px}
  h2{font-size:19px;margin:0 0 10px}
  #history{background:#fff;border-radius:14px;padding:8px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-size:17px}
  .row:last-child{border-bottom:0}
  .muted{color:#888}
</style>
</head>
<body>
<main>
  <h1>Wash 10 min</h1>
  <div id="session">今天第 1 次 Wash</div>

  <div id="timer">10:00</div>
  <div id="status">计时中</div>
  <div id="done">✓ Wash complete</div>

  <div class="actions">
    <button id="next" style="display:none">开始下一次 Wash</button>
    <button id="restart" class="secondary">重新开始本次 10 min</button>
  </div>

  <section>
    <h2>今天的记录</h2>
    <div id="history"></div>
  </section>
</main>

<script>
const DURATION = 10 * 60 * 1000;
const KEY = 'wash10_daily_v1';
let timerHandle = null;

function localDateKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit', hour12:false});
}

function loadData() {
  let data;
  try { data = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  const today = localDateKey();
  if (!data || data.date !== today) {
    data = {date: today, count: 0, history: [], current: null};
    saveData(data);
  }
  return data;
}

function saveData(data) {
  localStorage.setItem(KEY, JSON.stringify(data));
}

function startNewSession() {
  const data = loadData();
  const now = Date.now();
  data.count += 1;
  data.current = {
    n: data.count,
    startAt: now,
    endAt: now + DURATION,
    completed: false
  };
  data.history.push({n: data.count, startAt: now});
  saveData(data);
  render();
  runTimer();
}

function restartCurrent() {
  const data = loadData();
  if (!data.current) return startNewSession();
  const now = Date.now();
  data.current.startAt = now;
  data.current.endAt = now + DURATION;
  data.current.completed = false;
  const h = data.history.find(x => x.n === data.current.n);
  if (h) h.startAt = now;
  saveData(data);
  render();
  runTimer();
}

function completeCurrent() {
  const data = loadData();
  if (!data.current || data.current.completed) return;
  data.current.completed = true;
  const h = data.history.find(x => x.n === data.current.n);
  if (h) h.completedAt = Date.now();
  saveData(data);
  render();
  try { navigator.vibrate && navigator.vibrate([300,150,300,150,500]); } catch(e) {}
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.value = 0.18;
    osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, 1200);
  } catch(e) {}
}

function renderHistory(data) {
  const box = document.getElementById('history');
  if (!data.history.length) {
    box.innerHTML = '<div class="row"><span class="muted">今天还没有记录</span></div>';
    return;
  }
  box.innerHTML = data.history.map(x =>
    `<div class="row"><span>第 ${x.n} 次</span><span>${fmtTime(x.startAt)}</span></div>`
  ).join('');
}

function render() {
  const data = loadData();
  const cur = data.current;
  document.getElementById('session').textContent = cur ? `今天第 ${cur.n} 次 Wash` : '今天还没有 Wash';
  document.getElementById('done').style.display = cur && cur.completed ? 'block' : 'none';
  document.getElementById('next').style.display = cur && cur.completed ? 'block' : 'none';
  document.getElementById('status').textContent = cur && cur.completed ? '本次已完成' : '计时中';
  renderHistory(data);
}

function runTimer() {
  if (timerHandle) clearInterval(timerHandle);
  function tick() {
    const data = loadData();
    const cur = data.current;
    if (!cur) return;
    if (cur.completed) {
      document.getElementById('timer').textContent = '00:00';
      return;
    }
    let left = cur.endAt - Date.now();
    if (left <= 0) {
      document.getElementById('timer').textContent = '00:00';
      clearInterval(timerHandle);
      completeCurrent();
      return;
    }
    const totalSec = Math.ceil(left / 1000);
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    document.getElementById('timer').textContent = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }
  tick();
  timerHandle = setInterval(tick, 250);
}

function init() {
  const data = loadData();
  const cur = data.current;
  const now = Date.now();
  if (cur && !cur.completed && now < cur.endAt) {
    render();
    runTimer();
  } else {
    startNewSession();
  }
}

document.getElementById('restart').addEventListener('click', restartCurrent);
document.getElementById('next').addEventListener('click', startNewSession);

init();
</script>
</body>
</html>
