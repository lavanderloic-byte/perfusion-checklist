<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>振动切片 Checklist</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f6f6f6;color:#111;font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}
  main{max-width:560px;margin:auto;padding:28px 18px 40px}
  h1{font-size:30px;margin:0 0 8px}
  #progress{color:#666;margin-bottom:20px;font-size:16px}
  .item{display:flex;align-items:center;gap:14px;background:white;border-radius:14px;padding:18px 16px;margin:10px 0;font-size:20px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);user-select:none}
  .item input{width:25px;height:25px;flex:0 0 auto}
  .item.done span{text-decoration:line-through;color:#888}
  #complete{display:none;text-align:center;font-size:22px;font-weight:700;margin-top:24px}
  button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:24px;font-size:18px;background:#222;color:#fff}
</style>
</head>
<body>
<main>
  <h1>振动切片 Checklist</h1>
  <div id="progress">0 / 12</div>

  <label class="item"><input type="checkbox"><span>502</span></label>
  <label class="item"><input type="checkbox"><span>灭菌胶条</span></label>
  <label class="item"><input type="checkbox"><span>刀片</span></label>
  <label class="item"><input type="checkbox"><span>加满 PBS 或防冻液的 24 孔板</span></label>
  <label class="item"><input type="checkbox"><span>毛笔或镊子</span></label>
  <label class="item"><input type="checkbox"><span>纸巾</span></label>
  <label class="item"><input type="checkbox"><span>黑色底板</span></label>
  <label class="item"><input type="checkbox"><span>PBS</span></label>
  <label class="item"><input type="checkbox"><span>记号笔</span></label>
  <label class="item"><input type="checkbox"><span>平头钝镊子</span></label>
  <label class="item"><input type="checkbox"><span>脑子</span></label>
  <label class="item"><input type="checkbox"><span>振动切片机</span></label>

  <div id="complete">✓ 全部完成</div>
  <button id="reset" type="button">重新检查</button>
</main>
<script>
const boxes=[...document.querySelectorAll('input[type=checkbox]')];
const progress=document.getElementById('progress');
const complete=document.getElementById('complete');
function update(){let n=0;boxes.forEach(b=>{b.closest('.item').classList.toggle('done',b.checked);if(b.checked)n++});progress.textContent=`${n} / ${boxes.length}`;complete.style.display=n===boxes.length?'block':'none'}
boxes.forEach(b=>b.addEventListener('change',update));
document.getElementById('reset').addEventListener('click',()=>{boxes.forEach(b=>b.checked=false);update()});update();
</script>
</body>
</html>
